name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and smoke tests
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and audit locked dependencies
        run: dotnet restore --locked-mode -warnaserror
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Test file handling, rendering, search, and cancellation
        run: dotnet run --project tests/TheReadme.Smoke -c Release --no-build -- artifacts/screenshots
      - name: Build x64 and Arm64 installers
        run: ./scripts/Build-Installer.ps1
      - name: Test x64 installation, PATH, file registration, and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -Installer (Get-Item artifacts/installers/*-win-x64-setup.exe).FullName
      - name: Build and validate the Microsoft Store MSIX bundle
        run: ./scripts/Build-StorePackage.ps1
      - name: Upload the Microsoft Store bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-bundle
          path: |
            artifacts/store/*.msixbundle
            artifacts/store/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installers
          path: artifacts/installers/*
          if-no-files-found: error
      - name: Upload visual checks and installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-diagnostics
          path: |
            artifacts/screenshots/*.png
            ${{ runner.temp }}/setup.log
            ${{ runner.temp }}/uninstall.log
          if-no-files-found: ignore

  arm64:
    name: Windows Arm64 installer smoke test
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test document editing and source viewing on Arm64
        run: |
          dotnet restore --locked-mode -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build --no-restore -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/TheReadme.Smoke -c Release --no-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installers
          path: artifacts/installers
      - name: Test native Arm64 installation and startup
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -Installer (Get-Item artifacts/installers/*-win-arm64-setup.exe).FullName
      - name: Upload Arm64 installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm64-installer-logs
          path: |
            ${{ runner.temp }}/setup.log
            ${{ runner.temp }}/uninstall.log
          if-no-files-found: ignore
